[project]
name = "forgeworks-apishield-agent"
version = "0.1.0"
description = "Synthetic MVP for deterministic API change analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6.0,<7",
  "openapi-spec-validator==0.7.2",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2.13,<3", "pytest>=8,<9", "playwright>=1.48,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

