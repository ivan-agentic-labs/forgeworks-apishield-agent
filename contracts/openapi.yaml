        authorization.
  schemas:
    AnalysisJob:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - repository_id
      - base_sha
      - head_sha
      - capability_profile
      - job_id
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        repository_id:
          type: string
          format: uuid
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        head_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        capability_profile:
          type: string
        job_id:
          type: string
          format: uuid
    AnalysisDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - repository_id
      - base_sha
      - head_sha
      - finding_count
      - unsupported_count
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        repository_id:
          type: string
          format: uuid
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        head_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        finding_count:
          type: integer
        unsupported_count:
          type: integer
        completed_at:
          type: string
          format: date-time
    BreakingFinding:
      type: object
      additionalProperties: false
      required:
      - id
      - rule_id
      - severity
      - openapi_pointer
      - evidence_digest
      - coverage
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
        severity:
          type: string
        openapi_pointer:
          type: string
        evidence_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        coverage:
          type: string
    PatchProposal:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - analysis_id
      - base_sha
      - patch_sha256
      - sandbox_status
      - approval_status
      - version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        analysis_id:
          type: string
          format: uuid
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        patch_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        sandbox_status:
          type: string
        approval_status:
          type: string
        version:
          type: integer
          minimum: 1
          description: Current stored proposal version required as expected_version on review.
    ApprovalRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - proposal_id
      - patch_sha256
      - base_sha
      - reviewer_id
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        proposal_id:
          type: string
          format: uuid
        patch_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        reviewer_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    PullRequestResult:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - proposal_id
      - github_pr_node_id
      - draft
      - external_effect_key
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        proposal_id:
          type: string
          format: uuid
        github_pr_node_id:
          type: string
        draft:
          type: boolean
        external_effect_key:
          type: string
    CreateAnalysisRequest:
      type: object
      additionalProperties: false
      required:
      - base_sha
      - head_sha
      - capability_profile
      properties:
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        head_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        capability_profile:
          type: string
    CreateProposalRequest:
      type: object
      additionalProperties: false
      required:
      - analysis_id
      - target_language
      properties:
        analysis_id:
          type: string
          format: uuid
        target_language:
          type: string
    ApproveProposalRequest:
      type: object
      additionalProperties: false
      required:
      - patch_sha256
      - base_sha
      - decision
      - expected_version
      properties:
        patch_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        decision:
          type: string
          enum:
          - approve
          - reject
          description: Approval or rejection, performed only by a verified authorized human principal.
        expected_version:
          type: integer
          minimum: 1
          description: Optimistic lock for reviewed resource; stale version rejected with HTTP 409.
    CreatePullRequestRequest:
      type: object
      additionalProperties: false
      required:
      - approval_id
      - target_branch
      properties:
        approval_id:
          type: string
          format: uuid
        target_branch:
          type: string
    BreakingFindingPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BreakingFinding'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    Problem:
      type: object
      description: RFC 9457 problem details, with stable application extension code and correlation request_id
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI; about:blank allowed
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        request_id:
          type: string
          minLength: 1
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: Resource version is stale
        code: STALE_VERSION
        request_id: request_example_001
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - filename
      - size_bytes
      - sha256
      properties:
        kind:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256: &id002
          type: string
          pattern: ^[0-9a-f]{64}$
        declared_media_type: &id003
          type: string
    UploadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - status
      - upload_url
      - expires_at
      - required_headers
      properties:
        artifact_id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
        upload_url:
          type: string
          format: uri-reference
        expires_at: &id004
          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
    CommitUploadRequest:
      type: object
      additionalProperties: false
      required:
      - sha256
      - size_bytes
      - object_generation
      properties:
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 1
        object_generation:
          type: string
          minLength: 1
    ArtifactRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - kind
      - sha256
      - size_bytes
      - created_at
      properties:
        id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
          - QUARANTINED
          - VALIDATING
          - AVAILABLE
          - REJECTED
          - EXPIRED
          - DELETED
        kind: *id003
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 0
        created_at: *id004
        rejected_reason:
          type:
          - string
          - 'null'
    DownloadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - download_url
      - expires_at
      - object_generation
      properties:
        artifact_id: *id001
        download_url:
          type: string
          format: uri-reference
        expires_at: *id004
        object_generation: *id003
    JobStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - state
      - created_at
      - state_version
      - attempt_count
      properties:
        id: *id001
        kind: *id003
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - WAITING_APPROVAL
          - SUCCEEDED
          - FAILED_RETRYABLE
          - FAILED_TERMINAL
          - CANCELLED
          - BLOCKED
          - RECONCILIATION_REQUIRED
        created_at: *id004
        state_version:
          type: integer
          minimum: 1
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
x-design-status: REVIEW_REQUIRED_NOT_IMPLEMENTED
