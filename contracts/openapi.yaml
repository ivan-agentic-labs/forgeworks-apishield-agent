          format: uuid
        base_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        head_sha:
          type: string
          pattern: ^[0-9a-fA-F]{40,64}$
        capability_profile:
          type: string
        job_id:
          type: string
          format: uuid
    AnalysisDetail:
