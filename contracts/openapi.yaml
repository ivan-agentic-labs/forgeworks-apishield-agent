      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Unique per tenant/principal/action/request body; same key changed body returns 409.
