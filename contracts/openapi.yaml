      security:
      - BearerAuth: []
      tags:
      - APIShield Agent
      x-required-scope: repo:analyze
      x-idempotent-command: true
      responses:
        '202':
          description: Durable job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
