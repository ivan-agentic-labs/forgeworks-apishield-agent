name: APIShield MVP Application CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install MVP and verification dependencies
        run: python -m pip install -e 'apps/api[test]' -r scripts/requirements-verification.txt
      - name: Install browser for live static UI smoke test
        run: python -m playwright install chromium
      - name: Run unit, integration, resilience, and E2E acceptance tests
        run: python -W error -m pytest tests
      - name: Compile Python sources
        run: python -m compileall -q apps tests scripts
      - name: Run static contract checks
        run: python scripts/verify_bootstrap.py && python scripts/verify_contracts.py && python scripts/validate_openapi_independent.py
      - name: Check shell and browser JavaScript syntax
        run: bash -n scripts/probe_disposable_postgres.sh scripts/test_disposable_postgres_rls.sh && node --check apps/web/app.js && node --check apps/web/config.js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify browser session concurrency
        run: node --test tests/web/*.test.cjs
      - name: Generate and compile contract client
        run: |
          npm ci --prefix packages/sdk
          npm run check --prefix packages/sdk

      - name: Verify bounded TypeScript caller analysis and applicable migration diffs
        run: |
          npm ci --ignore-scripts --prefix packages/caller-analysis
          npm test --prefix packages/caller-analysis
          APISHIELD_CALLER_CLI_PROOF=yes python -W error -m pytest tests/unit/test_typescript_caller_cli.py
