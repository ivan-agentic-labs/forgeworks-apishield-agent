name: ForgeWorks Five-Product Bounded Staging Performance Proof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 3,15 * * *'
permissions:
  contents: read
# Prevent concurrent scheduled, manual and PR runs from multiplying staging load.
concurrency:
  group: forgeworks-five-product-bounded-staging
  cancel-in-progress: true
jobs:
  bounded-staging-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify latency evidence semantics without external network
        run: python3 -m unittest discover -s tests/unit -p 'test_bounded_staging_latency.py' -v
      - name: Probe live staging with bounded concurrency and report latency
        run: |
          set -o pipefail
          python3 -W error scripts/probe_bounded_staging_load.py | tee bounded-staging-performance.log
      - name: Archive per-endpoint staging performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgeworks-five-product-staging-performance
          path: bounded-staging-performance.log
          if-no-files-found: warn
          retention-days: 30
