name: ForgeWorks Five-Product Hosted Runtime Inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/observe_fleet_runtime.py'
      - 'scripts/verify_fleet_release.py'
      - 'tests/unit/test_live_inventory.py'
      - 'ops/releases/fleet-staging-candidate.json'
      - '.github/workflows/fleet-runtime-inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 0,6,12,18 * * *'
permissions:
  contents: read
concurrency:
  group: forgeworks-five-product-runtime-inventory
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test inventory with offline fault injection
        run: python -m unittest discover -s tests/unit -p 'test_live_inventory.py' -v
      - name: Observe five pinned staging origins without credentials
        run: python -W error scripts/observe_fleet_runtime.py
