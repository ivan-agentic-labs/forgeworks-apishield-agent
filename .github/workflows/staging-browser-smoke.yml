name: ForgeWorks Deployed Staging Browser Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_staging_browser.py
      - .github/workflows/staging-browser-smoke.yml
  pull_request:
    paths:
      - scripts/probe_staging_browser.py
      - .github/workflows/staging-browser-smoke.yml
permissions:
  contents: read
jobs:
  deployed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        product: [apishield-agent, accessfix-ai, specforge-ai, agenttest-lab, datareconcile-ai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Check actual public console and anonymous API boundary
        env:
          FW_PROBE_PRODUCT: ${{ matrix.product }}
        run: python scripts/probe_staging_browser.py "$FW_PROBE_PRODUCT"
