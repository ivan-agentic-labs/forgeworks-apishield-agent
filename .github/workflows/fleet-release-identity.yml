name: ForgeWorks Exact Five-Product Hosted Release Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/releases/fleet-staging-candidate.json'
      - '.github/workflows/fleet-release-identity.yml'
permissions:
  contents: read
jobs:
  public-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify all five exact source revisions and manifests
        run: |
          set -o pipefail
          python scripts/verify_fleet_release.py | tee fleet-release-proof.json
      - name: Archive machine-readable exact release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgeworks-exact-release-proof
          path: fleet-release-proof.json
          if-no-files-found: warn
          retention-days: 30
