name: ForgeWorks Exact Five-Product Hosted Release Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify all five exact source revisions and manifests
        run: python scripts/verify_fleet_release.py
