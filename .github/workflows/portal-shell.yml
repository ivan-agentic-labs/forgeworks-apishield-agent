name: ForgeWorks Unified Portal Shell Verification
on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'tests/platform/**'
      - 'scripts/verify_fleet_release.py'
      - 'ops/releases/fleet-staging-candidate.json'
      - '.github/workflows/portal-shell.yml'
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'tests/platform/**'
      - '.github/workflows/portal-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check browser JavaScript
        run: node --check apps/portal/app.js
      - name: Exercise frontend fleet transitions and fail-closed status
        run: node --test tests/platform/test_portal_js.mjs
      - name: Enforce offline catalog, origin and security boundaries
        run: python -m unittest discover -s tests/platform -p 'test_*.py' -v
      - name: Verify five fixed live staging service identities with no credentials
        run: python apps/portal/service_status.py --live-staging
