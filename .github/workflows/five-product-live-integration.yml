name: ForgeWorks Five-Product Live Integration Proof
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: read
jobs:
  external-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify origin-pinned transport and redirect denial without network
        run: python3 -m unittest discover -s tests/unit -p 'test_*probe*.py' -v
      - name: Verify all five public HTTPS APIs, Auth alignment, and business access denial
        run: python3 -W error scripts/verify_cross_product_staging.py
      - name: Verify bounded parallel live readiness performance and record p95
        run: python3 -W error scripts/probe_bounded_staging_load.py
